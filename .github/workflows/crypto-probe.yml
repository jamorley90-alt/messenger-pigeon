name: Native libsignal feasibility probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3.6'
          working-directory: ios/IntegrationProbe
          bundler-cache: false
      - run: bash scripts/install-xcodegen.sh
      - run: xcodegen generate
        working-directory: ios/IntegrationProbe
      - run: bundle install && bundle exec pod install
        working-directory: ios/IntegrationProbe
      - run: echo "SIMULATOR_ID=$(python3 scripts/select-simulator.py)" >> "$GITHUB_ENV"
      - name: Execute real cryptographic integration tests
        run: >-
          xcodebuild test
          -workspace ios/IntegrationProbe/SignalIntegrationProbe.xcworkspace
          -scheme SignalIntegrationProbe
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath artifacts/crypto-probe.xcresult
          CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: crypto-probe-evidence
          path: |
            artifacts/crypto-probe.xcresult
            ios/IntegrationProbe/Podfile.lock
            ios/IntegrationProbe/Gemfile.lock
          retention-days: 7

