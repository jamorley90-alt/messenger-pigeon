name: SignalIntegrationProbe
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SignalIntegrationProbe:
    type: framework
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.pigeon.signalprobe
  SignalIntegrationProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SignalIntegrationProbe
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @loader_path/Frameworks $(BUILT_PRODUCTS_DIR)/LibSignalClient'
schemes:
  SignalIntegrationProbe:
    build:
      targets:
        SignalIntegrationProbe: all
    test:
      targets: [SignalIntegrationProbeTests]
